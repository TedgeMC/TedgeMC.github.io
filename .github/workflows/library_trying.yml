name: Library Bumping

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC

  push:
    branches: [ "service" ]

jobs:
  amend-libraries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: "chmod u+x gradlew; ./gradlew runService"

      - name: Checkout website
        run: |
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin +refs/heads/website:refs/remotes/origin/website
          rm gradlew -f
          rm gradlew.bat -f
          git checkout --progress -B website refs/remotes/origin/website

      - name: Commit library overrides
        run: |
          echo "[$(date +%H:%M:%S)] Updating website"
          git add library_overrides

      - name: Push changes to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          msg="$(git log -1 --format=format:%s)"

          if [[ "$msg" == "Update libraries" ]];
          then
              git commit -m "Update libraries" --amend
          else
              git commit -m "Update libraries"
          fi

          git push
